name: Refresh GitHub stats

# Rebakes the contribution calendar, languages, monthly commits and code wall from live GitHub data,
# so the portfolio never shows a stale snapshot. A push to main then redeploys the site on Vercel.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-github-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild site data from GitHub
        run: node scripts/build-data.mjs --fetch-github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: weekly GitHub stats refresh"
          git push
